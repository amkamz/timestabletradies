; Export presets for the Godot rendering layer.
;
; Only one, and it exists to produce a **.pck** — the packed project data that
; the Android app ships in its assets and hands to the embedded engine. The app
; itself is built by Gradle, not by Godot, so nothing here needs a keystore and
; nothing here is a secret.
;
; Godot fills in any option absent from [preset.0.options] with its default,
; which is why this file is short rather than the several hundred lines the
; editor writes.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
package/unique_name="com.timestabletradies.godot"
package/name="Times Table Tradies"
package/signed=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
textures/vram_texture_compression/for_mobile=true
