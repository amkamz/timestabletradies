org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Let AGP fetch missing SDK platforms and build-tools. The machine has only
# android-33 installed and `sdkmanager` is broken on JDK 17 (JAXB was removed
# in Java 11), but android-sdk-license is already accepted, so AGP can do it.
android.builder.sdkDownload=true
